<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="robots" content="index, follow">
        <title>Presupuesto | Rumbo</title>
        <meta name="author" content="Nicolás Da Silva">
        <meta name="description" content="Solicite un presupuesto para su evento o reserva.">
        <meta name="keywords" content="presupuesto, precio">
        <link rel="stylesheet" href="../css/styles.css">
        <link rel="icon" type="image/x-icon" href="../favicon.ico">
    </head>
    <body>
        <div id="body-container">
            <header>
                <div id="header-container">
                    <h1>Rumbo</h1>
                    <nav>
                        <!-- La clase "selected" se usa para resaltar la sección actual -->
                        <a href="../index.html">Inicio</a>
                        <a href="galeria.html">Galería</a>
                        <a class="selected" href="#">Presupuesto</a>
                        <a href="contacto.html">Contacto</a>
                    </nav>
                </div>
            </header>
            <main>
                <h2>Solicite un presupuesto para su evento o reserva.</h2>
                <form id="budget" method="get"> <!-- "post" puede dar problemas en GitHub Pages -->
                    <p>
                        <label>Nombre: <input type="text" name="nombre" placeholder="Pedro" title="Entre 3 y 20 letras, sin números ni símbolos."
                            pattern="[A-Za-zÁÉÍÓÚÜÑáéíóúüñ ]{3,20}" maxlength="20" required></label>
                    </p>
                    <p>
                        <label>Teléfono: <input type="tel" name="telefono" placeholder="605605605" title="9 dígitos, sin espacios ni prefijo"
                            pattern="[0-9]{9}" required></label>
                    </p>
                    <p>
                        <label>E-mail: <input type="email" name="email" placeholder="correo@ejemplo.es" title="Un correo válido"
                            pattern="[^@]+@[^@]+\.[^@]+" required></label>
                    </p>
                    <p>
                        <label>Más información<textarea name="info" rows="4"
                            title="Cuéntenos cualquier detalle que nos ayude a preparar su presupuesto"></textarea></label>
                    </p>
                    <p>
                        <label><input type="checkbox" name="privacidad" required>He leído y aceptado la política de privacidad</label>
                    </p>
                    <p class="buttons">
                        <button type="submit">Enviar</button>
                        <button type="reset">Limpiar</button>
                    </p>                
                </form>
            </main>
            <footer>
                <div id="footer-container-1">
                    <div id="footer-container-2">
                        <nav>
                            <a href="https://www.instagram.com/">
                                <img src="../assets/img/instagram_icon.png" title="¡Síguenos en Instagram!" alt="Instagram del restaurante"
                                    width="240" height="240">
                            </a>
                            <a href="https://www.x.com/">
                                <img src="../assets/img/x_icon.png" title="¡Síguenos en X!" alt="X del restaurante"
                                    width="240" height="240">
                            </a>                
                            <a href="https://www.facebook.com/">
                                <img src="../assets/img/facebook_icon.png" title="¡Síguenos en Facebook!" alt="Facebook del restaurante"
                                    width="240" height="240">
                            </a>
                        </nav>
                        <p>&copy; 2026 Rumbo. Todos los derechos reservados.</p>
                    </div>
                </div>
            </footer>
        </div>
    </body>
</html>
